name: Refresh stats

on:
  schedule:
    # Sundays 1pm-11pm EST (fixed UTC-5, not DST-adjusted — see README), every 5 min:
    # 1pm-7:55pm EST -> 18:00-23:55 UTC
    - cron: '*/5 18-23 * * 0'
    # 8pm-11:55pm EST (Sunday local) -> 00:00-04:55 UTC Monday
    - cron: '*/5 0-4 * * 1'
    # Rest of the week (Mon-Sat), every 6 hours
    - cron: '0 */6 * * 1-6'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch latest touchdown stats
        run: node scripts/fetch-stats.mjs

      - name: Commit updated stats
        run: |
          if git diff --quiet -- data/scores.json; then
            echo "No stat changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scores.json
          git commit -m "Refresh stats"
          git push
